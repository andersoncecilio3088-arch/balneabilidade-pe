name: Atualizar Balneabilidade PE

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,15,19,23 * * *'

permissions:
  contents: read

concurrency:
  group: atualizar-balneabilidade
  cancel-in-progress: false

jobs:
  consultar-boletins:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar leitor de PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Consultar boletins da CPRH
        run: python scripts/atualizar_balneabilidade.py
