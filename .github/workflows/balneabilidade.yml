name: Atualizar Balneabilidade PE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consultar-boletins:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar leitor de PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Testar conexao com Supabase
        run: |
          python - <<'PY'
          import os
          import json
          from urllib.request import Request, urlopen

          url = os.environ["SUPABASE_URL"].rstrip("/")
          chave = os.environ["SUPABASE_SECRET_KEY"]

          requisicao = Request(
              url + "/rest/v1/pontos_coleta?select=id,codigo",
              headers={"apikey": chave}
          )

          with urlopen(requisicao, timeout=30) as resposta:
              dados = json.loads(resposta.read())

          print("Conexao com Supabase realizada com sucesso!")
          print("Pontos cadastrados:", len(dados))
          print("Nenhum dado foi alterado.")
          PY

      - name: Consultar boletins da CPRH
        run: python scripts/atualizar_balneabilidade.py
